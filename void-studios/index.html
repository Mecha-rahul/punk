    // --- STORE CONTEXT ---
    const StoreContext = createContext();

    function StoreProvider({ children }) {
      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem('punk_cart');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });
      const [currency, setCurrency] = useState('INR');
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isSizeGuideOpen, setIsSizeGuideOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [wishlist, setWishlist] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);
      const [discountPercent, setDiscountPercent] = useState(0);

      useEffect(() => {
        try {
          localStorage.setItem('punk_cart', JSON.stringify(cart));
        } catch(e) {}
      }, [cart]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      const formatPrice = (inrAmount) => {
        const curr = CURRENCIES[currency] || CURRENCIES.INR;
        if (currency === 'INR') {
          return `₹${inrAmount.toLocaleString('en-IN')}`;
        }
        const converted = inrAmount * curr.rate;
        return `${curr.symbol}${converted.toFixed(currency === 'JPY' ? 0 : 2)}`;
      };

      const addToCart = (product, size, color, quantity = 1) => {
        const itemKey = `${product.id}-${size}-${color.name}`;
        setCart(prev => {
          const existing = prev.find(item => item.key === itemKey);
          if (existing) {
            return prev.map(item =>
              item.key === itemKey ? { ...item, quantity: item.quantity + quantity } : item
            );
          }
          return [...prev, {
            key: itemKey,
            productId: product.id,
            name: product.name,
            tagline: product.tagline,
            priceINR: product.priceINR,
            size,
            color,
            image: product.images[color.imgIndex || 0] || product.images[0],
            quantity
          }];
        });
        showToast(`Added "${product.name}" (${size}) to bag`);
        setIsCartOpen(true);
      };

      const updateQuantity = (key, delta) => {
        setCart(prev => prev.map(item => {
          if (item.key === key) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (key) => {
        setCart(prev => prev.filter(item => item.key !== key));
        showToast('Item removed from bag');
      };

      const toggleWishlist = (productId) => {
        setWishlist(prev => {
          const exists = prev.includes(productId);
          if (exists) {
            showToast('Removed from wishlist');
            return prev.filter(id => id !== productId);
          } else {
            showToast('Saved to wishlist');
            return [...prev, productId];
          }
        });
      };

      const applyPromo = (code) => {
        const upper = code.trim().toUpperCase();
        if (upper === 'PUNK10' || upper === 'DELHI' || upper === 'PIYUSH') {
          setDiscountPercent(10);
          showToast('10% Delhi VIP discount applied!');
          return true;
        } else if (upper === 'PUNK20') {
          setDiscountPercent(20);
          showToast('20% Drop 01 discount applied!');
          return true;
        } else {
          showToast('Invalid code. Try "PUNK10"');
          return false;
        }
      };

      const subtotalINR = cart.reduce((sum, item) => sum + (item.priceINR * item.quantity), 0);
      const discountINR = (subtotalINR * discountPercent) / 100;
      const finalSubtotalINR = subtotalINR - discountINR;
      const freeShippingThresholdINR = 2499;
      const shippingRemainingINR = Math.max(0, freeShippingThresholdINR - finalSubtotalINR);
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <StoreContext.Provider value={{
          cart,
          currency,
          setCurrency,
          formatPrice,
          isCartOpen,
          setIsCartOpen,
          selectedProduct,
          setSelectedProduct,
          isSizeGuideOpen,
          setIsSizeGuideOpen,
          isSearchOpen,
          setIsSearchOpen,
          searchQuery,
          setSearchQuery,
          wishlist,
          toggleWishlist,
          addToCart,
          updateQuantity,
          removeFromCart,
          toastMessage,
          showToast,
          subtotalINR,
          discountINR,
          finalSubtotalINR,
          discountPercent,
          applyPromo,
          shippingRemainingINR,
          freeShippingThresholdINR,
          cartCount
        }}>
          {children}
        </StoreContext.Provider>
      );
    }

    const useStore = () => useContext(StoreContext);

    // --- REUSABLE ICON HELPER ---
    function Icon({ name, className = "w-5 h-5", size = 20 }) {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = '';
          const iconEl = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons.HelpCircle);
          if (iconEl) {
            iconEl.setAttribute('width', size);
            iconEl.setAttribute('height', size);
            ref.current.appendChild(iconEl);
          }
        }
      }, [name, size]);

      return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
    }

    // --- HORIZONTAL LOOKBOOK SECTION ---
    function HorizontalLookbook() {
      const { setSelectedProduct, formatPrice } = useStore();
      const scrollRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);
      const [startX, setStartX] = useState(0);
      const [scrollLeftState, setScrollLeftState] = useState(0);
      const [activeIndex, setActiveIndex] = useState(0);

      const handleMouseDown = (e) => {
        setIsDragging(true);
        setStartX(e.pageX - scrollRef.current.offsetLeft);
        setScrollLeftState(scrollRef.current.scrollLeft);
      };

      const handleMouseLeave = () => setIsDragging(false);
      const handleMouseUp = () => setIsDragging(false);

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - scrollRef.current.offsetLeft;
        const walk = (x - startX) * 1.6;
        scrollRef.current.scrollLeft = scrollLeftState - walk;
      };

      const scrollByAmount = (direction) => {
        if (scrollRef.current) {
          const shift = direction === 'left' ? -420 : 420;
          scrollRef.current.scrollBy({ left: shift, behavior: 'smooth' });
        }
      };

      const handleScrollEvent = () => {
        if (scrollRef.current) {
          const index = Math.round(scrollRef.current.scrollLeft / 380);
          setActiveIndex(Math.min(index, LOOKBOOK_SLIDES.length - 1));
        }
      };

      const openHotspotProduct = (productId) => {
        const prod = PRODUCTS_DATA.find(p => p.id === productId);
        if (prod) setSelectedProduct(prod);
      };

      return (
        <section id="lookbook-section" className="py-24 bg-brand-dark border-b border-brand-border relative overflow-hidden">

            </div>

            <div className="flex items-center gap-4">
              <div className="font-mono text-xs text-brand-muted">
                <span className="text-brand-light font-bold">{String(activeIndex + 1).padStart(2, '0')}</span> / {String(LOOKBOOK_SLIDES.length).padStart(2, '0')}
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => scrollByAmount('left')}
                  className="w-10 h-10 rounded-full border border-brand-border bg-brand-surface hover:bg-brand-black flex items-center justify-center text-brand-light transition-all"
                  aria-label="Scroll left"
                >
                  <Icon name="ArrowLeft" size={16} />
                </button>
                <button 
                  onClick={() => scrollByAmount('right')}

                  aria-label="Scroll right"
                >
                  <Icon name="ArrowRight" size={16} />
                </button>
              </div>
            </div>
          </div>

          {/* Horizontal Gallery */}
          <div 
            ref={scrollRef}
            onMouseDown={handleMouseDown}
            onMouseLeave={handleMouseLeave}
            onMouseUp={handleMouseUp}
            onMouseMove={handleMouseMove}
            onScroll={handleScrollEvent}
            className="flex gap-6 overflow-x-auto hide-scrollbar px-4 sm:px-8 pb-8 pt-2 drag-cursor select-none snap-x"
            style={{ scrollSnapType: 'x mandatory' }}
          >
            {LOOKBOOK_SLIDES.map((slide) => (
              <div 
                key={slide.id}

              >
                <div className="relative aspect-[3/4] overflow-hidden">
                  <img

                  <div className="absolute top-4 left-4 z-10">
                    <span className="font-mono text-[10px] uppercase tracking-widest bg-brand-black/80 backdrop-blur-md px-2.5 py-1 rounded text-brand-light border border-brand-border">
                      {slide.season}
                    </span>
                  </div>

                  {/* Hotspot */}
                  <div 
                    style={{ top: slide.hotspot.y, left: slide.hotspot.x }}
                    className="absolute z-20 -translate-x-1/2 -translate-y-1/2 group/hotspot"

                    </div>
                  </div>

                </div>
              </div>
            ))}
          </div>

          <div className="text-center mt-2 text-[11px] font-mono tracking-widest text-brand-muted uppercase flex items-center justify-center gap-2">
            <Icon name="MoveHorizontal" size={14} />

    // --- PRODUCT CATALOGUE (SHOP ALL) ---
    function ProductGrid() {
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedFit, setSelectedFit] = useState('ALL');
      const [sortBy, setSortBy] = useState('FEATURED');
      const [inStockOnly, setInStockOnly] = useState(false);

      const categories = ['ALL', 'Hoodies', 'Tees', 'Outerwear', 'Bottoms', 'Accessories'];
      const fits = ['ALL', 'Boxy', 'Oversized', 'Relaxed', 'Cropped'];

      const filteredProducts = useMemo(() => {
        return PRODUCTS_DATA.filter(product => {
          if (selectedCategory !== 'ALL' && product.category !== selectedCategory) return false;
          if (selectedFit !== 'ALL' && product.fit !== selectedFit) return false;
          if (inStockOnly && !product.inStock) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === 'PRICE_LOW') return a.priceINR - b.priceINR;
          if (sortBy === 'PRICE_HIGH') return b.priceINR - a.priceINR;
          if (sortBy === 'RATING') return b.rating - a.rating;
          return 0;
        });
      }, [selectedCategory, selectedFit, sortBy, inStockOnly]);

      return (
        <section id="shop-section" className="py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-8 border-b border-brand-border">
            <div>
              <span className="text-[11px] font-mono uppercase tracking-mega text-brand-muted block mb-1">

      const [selectedSize, setSelectedSize] = useState(selectedProduct.sizes[0]);

      const handleColorSelect = (color) => {

        setActiveImgIndex(color.imgIndex || 0);

        setQuantity(1);

      const totalImages = selectedProduct.images.length;

      const handlePrevImage = (e) => {
        e && e.stopPropagation();
        setActiveImgIndex((prev) => (prev === 0 ? totalImages - 1 : prev - 1));
      };

        e && e.stopPropagation();
        setActiveImgIndex((prev) => (prev === totalImages - 1 ? 0 : prev + 1));

        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft') handlePrevImage();

                  {/* ⬅️ PREV SWIPE BUTTON */}

                    <span className="uppercase tracking-widest">{selectedProduct.category}</span>
                    <div className="flex items-center gap-1 text-brand-accent">

                  <h2 className="font-editorial text-2xl sm:text-3xl font-bold tracking-wider uppercase text-brand-light">
                    {selectedProduct.name}

                    {selectedProduct.tagline}

                  <div className="mt-4 pb-4 border-b border-brand-border flex items-baseline justify-between">

    // --- DROP COUNTDOWN (CLEAN CLOCK, NO VIP EMAIL FORM) ---
    function DropCountdown() {
      const [timeLeft, setTimeLeft] = useState({ days: 3, hours: 14, minutes: 22, seconds: 40 });

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
            if (prev.minutes > 0) return { ...prev, minutes: 59, seconds: 59 };
            if (prev.hours > 0) return { ...prev, hours: prev.hours - 1, minutes: 59, seconds: 59 };
            if (prev.days > 0) return { ...prev, days: prev.days - 1, hours: 23, minutes: 59, seconds: 59 };
            return prev;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      return (
        <section id="drops-section" className="py-24 bg-brand-surface/70 border-b border-brand-border relative overflow-hidden">
          <div className="max-w-5xl mx-auto px-6 text-center">
            
            <span className="text-[11px] font-mono uppercase tracking-mega text-brand-accent block mb-2">
              Next Drop Scheduled
            </span>
            <h2 className="font-editorial text-3xl sm:text-5xl font-bold tracking-widest text-brand-light uppercase mb-4">
              DROP 02 // DELHI UNDERGROUND
            </h2>
            <p className="max-w-xl mx-auto text-xs sm:text-sm font-light text-brand-muted mb-12">
              Strictly limited to 100 numbered pieces. Heavyweight 340 GSM French Terry hoodies and curated vintage thrift outerwear.
            </p>

            {/* Countdown Clock Grid */}
            <div className="grid grid-cols-4 gap-3 sm:gap-6 max-w-lg mx-auto font-mono">
              {[
                { label: 'DAYS', val: timeLeft.days },
                { label: 'HOURS', val: timeLeft.hours },
                { label: 'MINUTES', val: timeLeft.minutes },
                { label: 'SECONDS', val: timeLeft.seconds }
              ].map((item, idx) => (
                <div key={idx} className="bg-brand-dark p-4 rounded border border-brand-border shadow-xl">
                  <span className="text-2xl sm:text-4xl font-bold text-brand-light block">
                    {String(item.val).padStart(2, '0')}
                  </span>
                  <span className="text-[9px] sm:text-[10px] uppercase text-brand-muted tracking-widest mt-1 block">
                    {item.label}
                  </span>
                </div>
              ))}
            </div>

          </div>
        </section>
      );
    }

        { size: 'L', chestIN: '44–46', chestCM: '112–117', lengthIN: '30.5', lengthCM: '77', sleeveIN: '25.5', sleeveCM: '65' },
        { size: 'XL', chestIN: '47–49', chestCM: '119–124', lengthIN: '31.5', lengthCM: '80', sleeveIN: '26.0', sleeveCM: '66' },

              <Icon name="X" size={18} />
            </button>

            <div className="flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-brand-accent mb-1">
              <Icon name="Ruler" size={14} />

            </div>
            <h3 className="font-editorial text-2xl font-bold tracking-widest uppercase mb-4">
              PUNK STUDIOS SIZE & FIT CALCULATOR

            <div className="bg-brand-surface p-4 rounded border border-brand-border mb-6">

                    onChange={(e) => setHeightVal(Number(e.target.value))}

                <div>
                  <label className="block text-brand-muted mb-1">Your Weight: {weightVal} kg</label>

                    type="range" min="45" max="115" value={weightVal} 
                    onChange={(e) => setWeightVal(Number(e.target.value))}

                  onClick={() => setUnit('CM')}

    // --- SEARCH OVERLAY ---
    function SearchModal() {
      const { isSearchOpen, setIsSearchOpen, searchQuery, setSearchQuery, setSelectedProduct, formatPrice } = useStore();
      const inputRef = useRef(null);

      useEffect(() => {
        if (isSearchOpen && inputRef.current) inputRef.current.focus();
      }, [isSearchOpen]);

      if (!isSearchOpen) return null;

      const searchResults = PRODUCTS_DATA.filter(p => 
        p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.tagline.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.fit.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="fixed inset-0 z-50 bg-brand-black/90 backdrop-blur-md p-4 sm:p-8 animate-fade-in flex flex-col items-center">
          <div className="w-full max-w-3xl">

              <div className="flex items-center gap-3 flex-1">
                <Icon name="Search" size={24} className="text-brand-muted" />
                <input 
                  ref={inputRef}
                  type="text" 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="SEARCH GARMENTS, GSM WEIGHT, CUT, COLORWAYS..."
                  className="w-full bg-transparent text-xl sm:text-2xl font-editorial text-brand-light placeholder:text-brand-muted/50 focus:outline-none uppercase tracking-wider"
                />
              </div>
              <button 
                onClick={() => { setIsSearchOpen(false); setSearchQuery(''); }}
                className="text-brand-muted hover:text-brand-light p-2"
              >
                <Icon name="X" size={24} />
              </button>
            </div>

            <div className="overflow-y-auto max-h-[70vh] space-y-4">
              {searchQuery.trim() === '' ? (
                <div className="text-xs font-mono text-brand-muted space-y-2">
                  <span className="uppercase tracking-widest block mb-2">Suggested:</span>
                  <div className="flex flex-wrap gap-2">
                    {['340 GSM Hoodie', '240 GSM Tee', 'Parachute Pants', 'Leather Bag', 'Delhi Drop'].map((tag, i) => (
                      <button 
                        key={i}
                        onClick={() => setSearchQuery(tag)}
                        className="bg-brand-surface px-3 py-1.5 rounded border border-brand-border hover:border-brand-muted text-brand-bone"
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>
              ) : searchResults.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {searchResults.map(prod => (
                    <div 
                      key={prod.id}
                      onClick={() => {
                        setSelectedProduct(prod);
                        setIsSearchOpen(false);
                      }}
                      className="flex gap-4 p-3 bg-brand-surface rounded border border-brand-border hover:border-brand-muted cursor-pointer transition-colors"
                    >
                      <img src={prod.images[0]} alt={prod.name} className="w-16 h-20 object-cover rounded bg-brand-dark" />
                      <div className="flex flex-col justify-center">
                        <span className="text-[10px] font-mono uppercase text-brand-accent">{prod.category} • {prod.fit}</span>
                        <h4 className="text-sm font-bold text-brand-light">{prod.name}</h4>
                        <span className="text-xs font-mono text-brand-muted mt-1">{formatPrice(prod.priceINR)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <p className="text-center py-12 font-mono text-xs text-brand-muted">
                  No matching garments located for "{searchQuery}".
                </p>
              )}
            </div>

          </div>
        </div>
      );
    }
