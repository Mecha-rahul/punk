    // --- CART & STORE CONTEXT ---
    const StoreContext = createContext();

    function StoreProvider({ children }) {
      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem('void_cart');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });
      const [currency, setCurrency] = useState('USD');
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isSizeGuideOpen, setIsSizeGuideOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [wishlist, setWishlist] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);
      const [promoCode, setPromoCode] = useState('');
      const [discountPercent, setDiscountPercent] = useState(0);

      useEffect(() => {
        try {
          localStorage.setItem('void_cart', JSON.stringify(cart));
        } catch(e) {}
      }, [cart]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      const formatPrice = (usdAmount) => {
        const curr = CURRENCIES[currency];
        const converted = usdAmount * curr.rate;
        if (currency === 'JPY') {
          return `${curr.symbol}${Math.round(converted).toLocaleString()}`;
        }
        return `${curr.symbol}${converted.toFixed(0)}`;
      };

      const addToCart = (product, size, color, quantity = 1) => {
        const itemKey = `${product.id}-${size}-${color.name}`;
        setCart(prev => {
          const existing = prev.find(item => item.key === itemKey);
          if (existing) {
            return prev.map(item =>
              item.key === itemKey ? { ...item, quantity: item.quantity + quantity } : item
            );
          }
          return [...prev, {
            key: itemKey,
            productId: product.id,
            name: product.name,
            tagline: product.tagline,
            priceUSD: product.priceUSD,
            size,
            color,
            image: product.images[color.imgIndex || 0],
            quantity
          }];
        });
        showToast(`Added "${product.name}" (${size}) to bag`);
        setIsCartOpen(true);
      };

      const updateQuantity = (key, delta) => {
        setCart(prev => prev.map(item => {
          if (item.key === key) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (key) => {
        setCart(prev => prev.filter(item => item.key !== key));
        showToast('Item removed from bag');
      };

      const toggleWishlist = (productId) => {
        setWishlist(prev => {
          const exists = prev.includes(productId);
          if (exists) {
            showToast('Removed from wishlist');
            return prev.filter(id => id !== productId);
          } else {
            showToast('Saved to wishlist');
            return [...prev, productId];
          }
        });
      };

      const applyPromo = (code) => {
        const upper = code.trim().toUpperCase();
        if (upper === 'VOID15' || upper === 'DROP01' || upper === 'PIYUSH') {
          setDiscountPercent(15);
          showToast('15% VIP discount applied!');
          return true;
        } else if (upper === 'VOID20') {
          setDiscountPercent(20);
          showToast('20% Black Tier discount applied!');
          return true;
        } else {
          showToast('Invalid promo code. Try "VOID15"');
          return false;
        }
      };

      const subtotalUSD = cart.reduce((sum, item) => sum + (item.priceUSD * item.quantity), 0);
      const discountUSD = (subtotalUSD * discountPercent) / 100;
      const finalSubtotalUSD = subtotalUSD - discountUSD;
      const freeShippingThresholdUSD = 150;
      const shippingRemainingUSD = Math.max(0, freeShippingThresholdUSD - finalSubtotalUSD);
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <StoreContext.Provider value={{
          cart,
          currency,
          setCurrency,
          formatPrice,
          isCartOpen,
          setIsCartOpen,
          selectedProduct,
          setSelectedProduct,
          isSizeGuideOpen,
          setIsSizeGuideOpen,
          isSearchOpen,
          setIsSearchOpen,
          searchQuery,
          setSearchQuery,
          wishlist,
          toggleWishlist,
          addToCart,
          updateQuantity,
          removeFromCart,
          toastMessage,
          showToast,
          subtotalUSD,
          discountUSD,
          finalSubtotalUSD,
          discountPercent,
          applyPromo,
          promoCode,
          setPromoCode,
          shippingRemainingUSD,
          freeShippingThresholdUSD,
          cartCount
        }}>
          {children}
        </StoreContext.Provider>
      );
    }

    const useStore = () => useContext(StoreContext);

    // --- REUSABLE ICON HELPER ---
    function Icon({ name, className = "w-5 h-5", size = 20 }) {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = '';
          const iconEl = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons.HelpCircle);
          if (iconEl) {
            iconEl.setAttribute('width', size);
            iconEl.setAttribute('height', size);
            ref.current.appendChild(iconEl);
          }
        }
      }, [name, size]);

      return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
    }

    // --- HORIZONTAL LOOKBOOK SECTION ---
    function HorizontalLookbook() {
      const { setSelectedProduct, formatPrice } = useStore();
      const scrollRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);
      const [startX, setStartX] = useState(0);
      const [scrollLeftState, setScrollLeftState] = useState(0);
      const [activeIndex, setActiveIndex] = useState(0);

      const handleMouseDown = (e) => {
        setIsDragging(true);
        setStartX(e.pageX - scrollRef.current.offsetLeft);
        setScrollLeftState(scrollRef.current.scrollLeft);
      };

      const handleMouseLeave = () => setIsDragging(false);
      const handleMouseUp = () => setIsDragging(false);

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - scrollRef.current.offsetLeft;
        const walk = (x - startX) * 1.6;
        scrollRef.current.scrollLeft = scrollLeftState - walk;
      };

      const scrollByAmount = (direction) => {
        if (scrollRef.current) {
          const shift = direction === 'left' ? -420 : 420;
          scrollRef.current.scrollBy({ left: shift, behavior: 'smooth' });
        }
      };

      const handleScrollEvent = () => {
        if (scrollRef.current) {
          const index = Math.round(scrollRef.current.scrollLeft / 380);
          setActiveIndex(Math.min(index, LOOKBOOK_SLIDES.length - 1));
        }
      };

      const openHotspotProduct = (productId) => {
        const prod = PRODUCTS_DATA.find(p => p.id === productId);
        if (prod) setSelectedProduct(prod);
      };

      return (
        <section id="lookbook-section" className="py-24 bg-brand-dark border-b border-brand-border relative overflow-hidden">

            </div>

            {/* Gallery Navigation Controls */}
            <div className="flex items-center gap-4">
              <div className="font-mono text-xs text-brand-muted">
                <span className="text-brand-light font-bold">{String(activeIndex + 1).padStart(2, '0')}</span> / {String(LOOKBOOK_SLIDES.length).padStart(2, '0')}
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => scrollByAmount('left')}

                onClick={() => setSelectedProduct(product)}

              <p className="text-[11px] font-mono text-brand-muted mt-0.5 truncate">

                {product.sizes.length > 4 && <span>+{product.sizes.length - 4}</span>}

    // --- PRODUCT CATALOG / SHOP SECTION ---
    function ProductGrid() {
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedFit, setSelectedFit] = useState('ALL');
      const [sortBy, setSortBy] = useState('FEATURED');
      const [inStockOnly, setInStockOnly] = useState(false);

      const categories = ['ALL', 'Hoodies', 'Tees', 'Outerwear', 'Bottoms', 'Accessories'];
      const fits = ['ALL', 'Boxy', 'Oversized', 'Relaxed', 'Cropped'];

      const filteredProducts = useMemo(() => {
        return PRODUCTS_DATA.filter(product => {
          if (selectedCategory !== 'ALL' && product.category !== selectedCategory) return false;
          if (selectedFit !== 'ALL' && product.fit !== selectedFit) return false;
          if (inStockOnly && !product.inStock) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === 'PRICE_LOW') return a.priceUSD - b.priceUSD;
          if (sortBy === 'PRICE_HIGH') return b.priceUSD - a.priceUSD;
          if (sortBy === 'RATING') return b.rating - a.rating;
          return 0; // FEATURED
        });

      return (
        <section id="shop-section" className="py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

          <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-8 border-b border-brand-border">

              <span className="text-[11px] font-mono uppercase tracking-mega text-brand-muted block mb-1">

              <h2 className="font-editorial text-3xl sm:text-4xl font-bold tracking-widest text-brand-light uppercase">

            {/* Sort & In-stock toggle */}
            <div className="flex flex-wrap items-center gap-4 text-xs font-mono">

              </label>

              <div className="flex items-center gap-2">
                <span className="text-brand-muted">Sort:</span>
                <select 
                  value={sortBy} 
                  onChange={(e) => setSortBy(e.target.value)}

                >
                  <option value="FEATURED">Featured Drop</option>
                  <option value="PRICE_LOW">Price: Low to High</option>

              {categories.map(cat => (
                <button

              <div className="flex gap-1.5">

                  <button 
                    key={f}
                    onClick={() => setSelectedFit(f)}
                    className={`text-[11px] uppercase py-1 px-2.5 rounded transition-colors ${

              <button 
                onClick={() => { setSelectedCategory('ALL'); setSelectedFit('ALL'); setInStockOnly(false); }}

    // --- UPCOMING DROPS & COUNTDOWN ---
    function DropCountdown() {
      const [timeLeft, setTimeLeft] = useState({ days: 4, hours: 16, minutes: 42, seconds: 18 });
      const [email, setEmail] = useState('');
      const [signedUp, setSignedUp] = useState(false);

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
            if (prev.minutes > 0) return { ...prev, minutes: 59, seconds: 59 };
            if (prev.hours > 0) return { ...prev, hours: prev.hours - 1, minutes: 59, seconds: 59 };
            if (prev.days > 0) return { ...prev, days: prev.days - 1, hours: 23, minutes: 59, seconds: 59 };
            return prev;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const handleSignup = (e) => {
        e.preventDefault();
        if (email) setSignedUp(true);
      };

      return (
        <section id="drops-section" className="py-24 bg-brand-surface/70 border-b border-brand-border relative overflow-hidden">
          <div className="max-w-5xl mx-auto px-6 text-center">
            
            <span className="text-[11px] font-mono uppercase tracking-mega text-brand-accent block mb-2">
              Next Archive Release
            </span>
            <h2 className="font-editorial text-3xl sm:text-5xl font-bold tracking-widest text-brand-light uppercase mb-4">
              DROP 02 // MONOCHROME MONOLITH
            </h2>
            <p className="max-w-xl mx-auto text-xs sm:text-sm font-light text-brand-muted mb-12">
              Strictly limited to 150 pieces worldwide. Heavyweight Japanese Melton wool outerwear, technical trousers, and raw silver accessories.
            </p>

            {/* Countdown Clock Grid */}
            <div className="grid grid-cols-4 gap-3 sm:gap-6 max-w-lg mx-auto font-mono mb-12">
              {[
                { label: 'DAYS', val: timeLeft.days },
                { label: 'HOURS', val: timeLeft.hours },
                { label: 'MINUTES', val: timeLeft.minutes },
                { label: 'SECONDS', val: timeLeft.seconds }
              ].map((item, idx) => (
                <div key={idx} className="bg-brand-dark p-4 rounded border border-brand-border shadow-xl">
                  <span className="text-2xl sm:text-4xl font-bold text-brand-light block">
                    {String(item.val).padStart(2, '0')}
                  </span>
                  <span className="text-[9px] sm:text-[10px] uppercase text-brand-muted tracking-widest mt-1 block">
                    {item.label}
                  </span>
                </div>
              ))}
            </div>

            {/* VIP Early Access Sign Up Form */}
            <div className="max-w-md mx-auto">
              {signedUp ? (
                <div className="p-4 bg-brand-dark rounded border border-green-500/40 text-green-400 font-mono text-xs flex items-center justify-center gap-2">
                  <Icon name="Check" size={15} />
                  <span>VIP Access Confirmed. Password sent 1 hour prior to drop.</span>
                </div>
              ) : (
                <form onSubmit={handleSignup} className="flex gap-2">
                  <input 
                    type="email" 
                    required
                    placeholder="ENTER EMAIL FOR 1-HR EARLY ACCESS" 
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="flex-1 bg-brand-dark border border-brand-border rounded px-4 py-3 text-xs font-mono text-brand-light focus:outline-none focus:border-brand-muted placeholder:text-brand-muted/70"
                  />
                  <button 
                    type="submit"
                    className="px-6 py-3 bg-brand-light hover:bg-white text-brand-black font-mono text-xs font-bold uppercase tracking-wider rounded transition-all"
                  >
                    Join VIP
                  </button>
                </form>
              )}
            </div>

          </div>
        </section>
      );
    }

    // --- SEARCH OVERLAY MODAL ---
    function SearchModal() {
      const { isSearchOpen, setIsSearchOpen, searchQuery, setSearchQuery, setSelectedProduct, formatPrice } = useStore();
      const inputRef = useRef(null);

      useEffect(() => {
        if (isSearchOpen && inputRef.current) {
          inputRef.current.focus();
        }
      }, [isSearchOpen]);

      if (!isSearchOpen) return null;

      const searchResults = PRODUCTS_DATA.filter(p => 
        p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.tagline.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.fit.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="fixed inset-0 z-50 bg-brand-black/90 backdrop-blur-md p-4 sm:p-8 animate-fade-in flex flex-col items-center">

                  ref={inputRef}

                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="SEARCH GARMENTS, GSM WEIGHT, CUT, COLORWAYS..."
                  className="w-full bg-transparent text-xl sm:text-2xl font-editorial text-brand-light placeholder:text-brand-muted/50 focus:outline-none uppercase tracking-wider"
                />
              </div>
              <button 
                onClick={() => { setIsSearchOpen(false); setSearchQuery(''); }}
                className="text-brand-muted hover:text-brand-light p-2"
              >
                <Icon name="X" size={24} />
              </button>
            </div>

            {/* Results Grid */}
            <div className="overflow-y-auto max-h-[70vh] space-y-4">
              {searchQuery.trim() === '' ? (
                <div className="text-xs font-mono text-brand-muted space-y-2">
                  <span className="uppercase tracking-widest block mb-2">Suggested Inquiries:</span>
                  <div className="flex flex-wrap gap-2">

                        onClick={() => setSearchQuery(tag)}

                        {tag}
                      </button>
                    ))}

              ) : searchResults.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {searchResults.map(prod => (
                    <div 
                      key={prod.id}
                      onClick={() => {
                        setSelectedProduct(prod);
                        setIsSearchOpen(false);
                      }}
                      className="flex gap-4 p-3 bg-brand-surface rounded border border-brand-border hover:border-brand-muted cursor-pointer transition-colors"
                    >
                      <img src={prod.images[0]} alt={prod.name} className="w-16 h-20 object-cover rounded bg-brand-dark" />
                      <div className="flex flex-col justify-center">
                        <span className="text-[10px] font-mono uppercase text-brand-accent">{prod.category} • {prod.fit}</span>
                        <h4 className="text-sm font-bold text-brand-light">{prod.name}</h4>
                        <span className="text-xs font-mono text-brand-muted mt-1">{formatPrice(prod.priceUSD)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <p className="text-center py-12 font-mono text-xs text-brand-muted">
                  No matching garments located for "{searchQuery}".
                </p>
              )}
            </div>

          </div>
        </div>
      );
    }
