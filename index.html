    // --- STORE CONTEXT ---
    const StoreContext = createContext();

    // --- AUTH HELPERS (localStorage demo accounts) ---
    const AUTH_USERS_KEY = 'punk_users';
    const AUTH_SESSION_KEY = 'punk_session';

    function loadAuthUsers() {
      try { return JSON.parse(localStorage.getItem(AUTH_USERS_KEY)) || []; } catch(e) { return []; }
    }

    function saveAuthUsers(users) {
      try { localStorage.setItem(AUTH_USERS_KEY, JSON.stringify(users)); } catch(e) {}
    }

    function StoreProvider({ children }) {
      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem('punk_cart');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });
      const [currency, setCurrency] = useState('INR');
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isSizeGuideOpen, setIsSizeGuideOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [wishlist, setWishlist] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);
      const [discountPercent, setDiscountPercent] = useState(0);

      // --- AUTH STATE ---
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem(AUTH_SESSION_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authView, setAuthView] = useState('login'); // 'login' | 'signup'

      useEffect(() => {
        try {
          if (currentUser) localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(currentUser));
          else localStorage.removeItem(AUTH_SESSION_KEY);
        } catch(e) {}
      }, [currentUser]);

      useEffect(() => {
        try {
          localStorage.setItem('punk_cart', JSON.stringify(cart));
        } catch(e) {}
      }, [cart]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      const formatPrice = (inrAmount) => {
        const curr = CURRENCIES[currency] || CURRENCIES.INR;
        if (currency === 'INR') {
          return curr.symbol + inrAmount.toLocaleString('en-IN');
        }
        const converted = inrAmount * curr.rate;
        return `${curr.symbol}${converted.toFixed(currency === 'JPY' ? 0 : 2)}`;
      };

      const addToCart = (product, size, color, quantity = 1) => {
        const itemKey = `${product.id}-${size}-${color.name}`;
        setCart(prev => {
          const existing = prev.find(item => item.key === itemKey);
          if (existing) {
            return prev.map(item =>
              item.key === itemKey ? { ...item, quantity: item.quantity + quantity } : item
            );
          }
          return [...prev, {
            key: itemKey,
            productId: product.id,
            name: product.name,
            tagline: product.tagline,
            priceINR: product.priceINR,
            size,
            color,
            image: (product.images && product.images.length > 0) ? (product.images[color.imgIndex || 0] || product.images[0]) : null,
            quantity
          }];
        });
        showToast(`Added "${product.name}" (${size}) to bag`);
        setIsCartOpen(true);
      };

      const updateQuantity = (key, delta) => {
        setCart(prev => prev.map(item => {
          if (item.key === key) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (key) => {
        setCart(prev => prev.filter(item => item.key !== key));
        showToast('Item removed from bag');
      };

      const toggleWishlist = (productId) => {
        setWishlist(prev => {
          const exists = prev.includes(productId);
          if (exists) {
            showToast('Removed from wishlist');
            return prev.filter(id => id !== productId);
          } else {
            showToast('Saved to wishlist');
            return [...prev, productId];
          }
        });
      };

      const applyPromo = (code) => {
        const upper = code.trim().toUpperCase();
        if (upper === 'PUNK10' || upper === 'DELHI' || upper === 'PIYUSH') {
          setDiscountPercent(10);
          showToast('10% Delhi VIP discount applied!');
          return true;
        } else if (upper === 'PUNK20') {
          setDiscountPercent(20);
          showToast('20% Drop 01 discount applied!');
          return true;
        } else {
          showToast('Invalid code. Try "PUNK10"');
          return false;
        }
      };

      const signUp = (name, email, password) => {
        const users = loadAuthUsers();
        const emailNorm = email.trim().toLowerCase();
        if (!name.trim() || !emailNorm || !password) {
          showToast('Please fill in all fields');
          return false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailNorm)) {
          showToast('Please enter a valid email address');
          return false;
        }
        if (password.length < 6) {
          showToast('Password must be at least 6 characters');
          return false;
        }
        if (users.some(u => u.email === emailNorm)) {
          showToast('An account with this email already exists');
          return false;
        }
        const user = { id: 'u-' + Date.now(), name: name.trim(), email: emailNorm, createdAt: new Date().toISOString() };
        users.push({ ...user, password });
        saveAuthUsers(users);
        setCurrentUser(user);
        setIsAuthOpen(false);
        showToast(`Welcome to the archive, ${user.name.split(' ')[0]}!`);
        return true;
      };

      const login = (email, password) => {
        const emailNorm = email.trim().toLowerCase();
        const users = loadAuthUsers();
        const found = users.find(u => u.email === emailNorm && u.password === password);
        if (!found) {
          showToast('Invalid email or password');
          return false;
        }
        const { password: _pw, ...user } = found;
        setCurrentUser(user);
        setIsAuthOpen(false);
        showToast(`Welcome back, ${user.name.split(' ')[0]}!`);
        return true;
      };

      const logout = () => {
        setCurrentUser(null);
        showToast('Signed out of your account');
      };

      const subtotalINR = cart.reduce((sum, item) => sum + (item.priceINR * item.quantity), 0);
      const discountINR = (subtotalINR * discountPercent) / 100;
      const finalSubtotalINR = subtotalINR - discountINR;
      const freeShippingThresholdINR = 2499;
      const shippingRemainingINR = Math.max(0, freeShippingThresholdINR - finalSubtotalINR);
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <StoreContext.Provider value={{
          cart,
          currency,
          setCurrency,
          formatPrice,
          isCartOpen,
          setIsCartOpen,
          selectedProduct,
          setSelectedProduct,
          isSizeGuideOpen,
          setIsSizeGuideOpen,
          isSearchOpen,

          searchQuery,

          discountPercent,
          applyPromo,
          shippingRemainingINR,
          freeShippingThresholdINR,
          cartCount,
          currentUser,
          isAuthOpen,
          setIsAuthOpen,
          authView,
          setAuthView,
          signUp,
          login,
          logout
        }}>
          {children}
        </StoreContext.Provider>
      );
    }

      const [scrollLeftState, setScrollLeftState] = useState(0);
      const [activeIndex, setActiveIndex] = useState(0);

      const handleMouseDown = (e) => {
        setIsDragging(true);
        setStartX(e.pageX - scrollRef.current.offsetLeft);
        setScrollLeftState(scrollRef.current.scrollLeft);
      };

      const handleMouseLeave = () => setIsDragging(false);
      const handleMouseUp = () => setIsDragging(false);

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - scrollRef.current.offsetLeft;
        const walk = (x - startX) * 1.6;
        scrollRef.current.scrollLeft = scrollLeftState - walk;
      };

      const scrollByAmount = (direction) => {
        if (scrollRef.current) {
          const shift = direction === 'left' ? -420 : 420;
          scrollRef.current.scrollBy({ left: shift, behavior: 'smooth' });
        }
      };

      const handleScrollEvent = () => {
        if (scrollRef.current) {
          const index = Math.round(scrollRef.current.scrollLeft / 380);
          setActiveIndex(Math.min(index, LOOKBOOK_SLIDES.length - 1));

    // --- PRODUCT CATALOGUE (SHOP ALL - FADL STYLE) ---
    function ProductGrid() {
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedFit, setSelectedFit] = useState('ALL');
      const [sortBy, setSortBy] = useState('FEATURED');
      const [inStockOnly, setInStockOnly] = useState(false);

      const categories = ['ALL', 'Hoodies', 'Tees', 'Outerwear', 'Bottoms', 'Accessories'];
      const fits = ['ALL', 'Boxy', 'Oversized', 'Relaxed', 'Cropped'];

      const filteredProducts = useMemo(() => {
        return PRODUCTS_DATA.filter(product => {
          if (selectedCategory !== 'ALL' && product.category !== selectedCategory) return false;
          if (selectedFit !== 'ALL' && product.fit !== selectedFit) return false;
          if (inStockOnly && !product.inStock) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === 'PRICE_LOW') return a.priceINR - b.priceINR;
          if (sortBy === 'PRICE_HIGH') return b.priceINR - a.priceINR;
          if (sortBy === 'RATING') return b.rating - a.rating;
          return 0;
        });
      }, [selectedCategory, selectedFit, sortBy, inStockOnly]);

      return (
        <section id="shop-section" className="py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div>
              <span className="text-[11px] uppercase tracking-[0.2em] text-neutral-500 block mb-1 font-medium">

              <h2 className="font-sans text-3xl sm:text-4xl font-black tracking-[0.18em] text-black uppercase">
                SHOP ARCHIVE

            <div className="flex flex-wrap items-center gap-4 text-xs">

              </label>

              <div className="flex items-center gap-2 font-medium">
                <span className="text-neutral-500">Sort:</span>
                <select 
                  value={sortBy} 
                  onChange={(e) => setSortBy(e.target.value)}
                  className="bg-white text-black text-xs py-1.5 px-3 rounded-none border border-neutral-300 hover:border-black focus:outline-none cursor-pointer transition-colors"
                >
                  <option value="FEATURED">Featured Pieces</option>

                  <option value="PRICE_HIGH">Price: High to Low</option>

            <div className="flex flex-wrap gap-2">
              {categories.map(cat => (
                <button 
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`text-xs uppercase tracking-wider py-1.5 px-4 rounded-none transition-all font-medium ${
                    selectedCategory === cat 
                      ? 'bg-black text-white font-bold shadow-sm' 
                      : 'bg-white text-neutral-600 hover:text-black border border-neutral-200 hover:border-black'

                >
                  {cat}

            <div className="flex items-center gap-2 text-xs">
              <span className="text-neutral-500 text-[11px] uppercase font-medium">Silhouette:</span>
              <div className="flex gap-1.5">
                {fits.map(f => (
                  <button 
                    key={f}
                    onClick={() => setSelectedFit(f)}
                    className={`text-[11px] uppercase py-1 px-3 rounded-none transition-colors font-medium ${
                      selectedFit === f 
                        ? 'bg-neutral-100 text-black border border-black' 
                        : 'text-neutral-500 hover:text-black border border-transparent'
                    }`}

            </div>

    // --- PRODUCT DETAIL MODAL (FADL CONTEMPORARY LUXURY) ---
    function ProductDetailModal() {
      const { selectedProduct, setSelectedProduct, formatPrice, addToCart, setIsSizeGuideOpen } = useStore();
      if (!selectedProduct) return null;

      const [selectedColor, setSelectedColor] = useState(selectedProduct.colors[0]);
      const [selectedSize, setSelectedSize] = useState(selectedProduct.sizes[0]);
      const [activeImgIndex, setActiveImgIndex] = useState(selectedColor.imgIndex || 0);
      const [quantity, setQuantity] = useState(1);
      const [activeTab, setActiveTab] = useState('DETAILS');

      // Sync colorway change
      const handleColorSelect = (color) => {
        setSelectedColor(color);
        setActiveImgIndex(color.imgIndex || 0);
      };

      // Reset / Undo selections back to defaults
      const handleResetSelection = () => {
        setSelectedColor(selectedProduct.colors[0]);
        setSelectedSize(selectedProduct.sizes[0]);
        setActiveImgIndex(selectedProduct.colors[0].imgIndex || 0);
        setQuantity(1);
      };

      // SWIPE / SLIDE BUTTONS: PREVIOUS & NEXT IMAGE
      const totalImages = selectedProduct.images ? selectedProduct.images.length : 0;

      const handlePrevImage = (e) => {
        e && e.stopPropagation();
        if (totalImages <= 1) return;
        setActiveImgIndex((prev) => (prev === 0 ? totalImages - 1 : prev - 1));
      };

      const handleNextImage = (e) => {
        e && e.stopPropagation();
        if (totalImages <= 1) return;
        setActiveImgIndex((prev) => (prev === totalImages - 1 ? 0 : prev + 1));
      };

      // Keyboard arrow navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft') handlePrevImage();
          if (e.key === 'ArrowRight') handleNextImage();
          if (e.key === 'Escape') setSelectedProduct(null);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [totalImages]);

      const currentStockForSize = selectedProduct.sizeStock[selectedSize] || 0;

      return (
        <div 
          className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/60 backdrop-blur-md overflow-y-auto"
          onClick={() => setSelectedProduct(null)}
        >
          <div 
            className="relative w-full max-w-5xl bg-white border border-neutral-200 rounded-none shadow-2xl overflow-hidden animate-fade-in my-8 text-black"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Top Navigation Bar inside Modal */}
            <div className="bg-neutral-50 px-4 sm:px-6 py-3.5 border-b border-neutral-200 flex items-center justify-between">
              
              {/* Back to Catalogue Button */}
              <button 
                onClick={() => setSelectedProduct(null)}
                className="flex items-center gap-2 text-xs uppercase tracking-widest font-bold text-neutral-700 hover:text-black bg-white px-3.5 py-2 rounded-none border border-neutral-300 hover:border-black transition-all active:scale-95 shadow-sm"
                title="Back to Catalog"
              >
                <Icon name="ArrowLeft" size={14} />
                <span>Back to Catalogue</span>
              </button>

              <div className="flex items-center gap-3">
                {/* Reset / Undo Option */}
                <button 
                  onClick={handleResetSelection}
                  className="hidden sm:flex items-center gap-1.5 text-[11px] uppercase tracking-wider font-semibold text-neutral-500 hover:text-black transition-colors"
                  title="Reset color and size"
                >
                  <Icon name="RotateCcw" size={12} />
                  <span>Reset</span>
                </button>

                {/* Close 'X' Button */}
                <button 
                  onClick={() => setSelectedProduct(null)}
                  className="w-8 h-8 rounded-full bg-white border border-neutral-300 text-neutral-600 hover:text-black hover:border-black flex items-center justify-center transition-colors shadow-sm"
                  title="Close (Esc)"
                >
                  <Icon name="X" size={16} />
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 min-h-[580px]">
              
              {/* Left Column: Image Gallery */}
              <div className="lg:col-span-7 bg-neutral-50 p-6 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-neutral-200">
                
                {/* Main Large Image Frame */}
                <div className="relative aspect-[4/5] rounded-none overflow-hidden bg-[#F5F5F5] mb-4 group select-none shadow-sm border border-neutral-200/80">
                  {totalImages > 0 ? (
                    <img 
                      src={selectedProduct.images[activeImgIndex] || selectedProduct.images[0]} 
                      alt={selectedProduct.name} 
                      className="w-full h-full object-cover object-center filter contrast-[1.02] transition-all duration-300"
                    />
                  ) : (
                    <div className="w-full h-full bg-[#F5F5F5] flex items-center justify-center" />
                  )}

                  {/* Cut Badge */}
                  <div className="absolute top-3 left-3 z-20">
                    <span className="text-[10px] uppercase tracking-widest bg-white/95 px-3 py-1 rounded-none text-black border border-neutral-300 font-bold shadow-sm">
                      {selectedProduct.fit} Cut
                    </span>
                  </div>

                  {/* Image Counter Badge */}
                  {totalImages > 1 && (
                    <div className="absolute top-3 right-3 z-20">
                      <span className="text-[10px] bg-white/95 backdrop-blur-md px-2.5 py-0.5 rounded-none text-black border border-neutral-300 font-medium">
                        {activeImgIndex + 1} / {totalImages}
                      </span>
                    </div>
                  )}

                  {/* PREV & NEXT SWIPE BUTTONS */}
                  {totalImages > 1 && (
                    <>
                      <button 
                        onClick={handlePrevImage}
                        className="absolute left-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/95 hover:bg-black hover:text-white text-black border border-neutral-300 flex items-center justify-center transition-all hover:scale-105 active:scale-95 shadow-md"
                        title="Previous Image (Left Arrow)"
                      >
                        <Icon name="ChevronLeft" size={20} />
                      </button>

                      <button 
                        onClick={handleNextImage}
                        className="absolute right-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/95 hover:bg-black hover:text-white text-black border border-neutral-300 flex items-center justify-center transition-all hover:scale-105 active:scale-95 shadow-md"
                        title="Next Image (Right Arrow)"
                      >
                        <Icon name="ChevronRight" size={20} />
                      </button>

                      <div className="absolute bottom-3 inset-x-0 flex justify-center z-20 pointer-events-none">
                        <span className="text-[10px] bg-white/90 backdrop-blur-md px-3 py-1 rounded-none text-neutral-600 border border-neutral-200 flex items-center gap-1.5 shadow-sm font-medium">
                          <Icon name="MoveHorizontal" size={12} />
                          <span>Use &lt; &gt; buttons to change photo</span>
                        </span>
                      </div>
                    </>
                  )}
                </div>

                {/* Horizontal Thumbnails */}
                {totalImages > 1 && (
                  <div className="flex gap-3 overflow-x-auto pb-2 hide-scrollbar">
                    {selectedProduct.images.map((img, idx) => (
                      <button 
                        key={idx}
                        onClick={() => setActiveImgIndex(idx)}
                        className={`relative w-20 h-24 flex-shrink-0 rounded-none overflow-hidden border-2 transition-all ${
                          activeImgIndex === idx ? 'border-black scale-95 shadow-sm' : 'border-neutral-200 opacity-60 hover:opacity-100'
                        }`}
                      >
                        <img src={img} alt="thumb" className="w-full h-full object-cover" />
                      </button>
                    ))}
                  </div>
                )}
              </div>

              {/* Right Column: Garment Specs, Sizing & Add to Bag */}
              <div className="lg:col-span-5 p-6 sm:p-8 flex flex-col justify-between bg-white">
                
                <div>
                  <div className="flex items-center justify-between text-xs font-semibold text-neutral-500 mb-2 uppercase tracking-widest">
                    <span>{selectedProduct.category}</span>
                    <div className="flex items-center gap-1 text-black">
                      <Icon name="Star" size={13} className="fill-black" />
                      <span>{selectedProduct.rating} ({selectedProduct.reviewsCount} review)</span>
                    </div>
                  </div>

                  <h2 className="font-sans text-2xl sm:text-3xl font-extrabold tracking-tight uppercase text-black">
                    {selectedProduct.name}
                  </h2>
                  <p className="text-xs text-neutral-500 mt-1 font-normal">
                    {selectedProduct.tagline}
                  </p>

                  <div className="mt-4 pb-4 border-b border-neutral-200 flex items-baseline justify-between">
                    <span className="text-2xl font-bold tracking-wider text-black price-text">
                      {formatPrice(selectedProduct.priceINR)}
                    </span>
                    <span className="text-[11px] text-neutral-500 uppercase font-medium">
                      GST Included · Delhi Dispatch
                    </span>
                  </div>

                  {/* Colorway Selection */}
                  <div className="mt-6">
                    <div className="flex items-center justify-between text-xs mb-2">

    // --- DROP COUNTDOWN (FADL CONTEMPORARY LUXURY) ---
    function DropCountdown() {
      const [timeLeft, setTimeLeft] = useState({ days: 3, hours: 14, minutes: 22, seconds: 40 });

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
            if (prev.minutes > 0) return { ...prev, minutes: 59, seconds: 59 };
            if (prev.hours > 0) return { ...prev, hours: prev.hours - 1, minutes: 59, seconds: 59 };
            if (prev.days > 0) return { ...prev, days: prev.days - 1, hours: 23, minutes: 59, seconds: 59 };
            return prev;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      return (
        <section id="drops-section" className="py-24 bg-white border-b border-neutral-200 relative overflow-hidden">
          <div className="max-w-5xl mx-auto px-6 text-center">
            
            <span className="text-[11px] font-semibold uppercase tracking-[0.2em] text-neutral-500 block mb-2">
              Next Drop Scheduled

              DROP 02 DELHI UNDERGROUND

            <p className="max-w-xl mx-auto text-xs sm:text-sm font-normal text-neutral-500 mb-12">
              Strictly limited to 100 numbered pieces. Heavyweight 340 GSM French Terry hoodies and curated vintage thrift outerwear.
            </p>

            {/* Countdown Clock Grid */}
            <div className="grid grid-cols-4 gap-3 sm:gap-6 max-w-lg mx-auto font-sans">
              {[
                { label: 'DAYS', val: timeLeft.days },
                { label: 'HOURS', val: timeLeft.hours },
                { label: 'MINUTES', val: timeLeft.minutes },
                { label: 'SECONDS', val: timeLeft.seconds }
              ].map((item, idx) => (
                <div key={idx} className="bg-neutral-50 p-5 rounded-none border border-neutral-200 shadow-sm text-center">
                  <span className="text-2xl sm:text-4xl font-extrabold text-black block tracking-tight">

                    {item.label}

                </div>
              ))}

      );

              <table className="w-full text-xs font-mono text-left">
                <thead className="bg-neutral-100 text-neutral-600 uppercase text-[10px] tracking-wider border-b border-neutral-200">
                  <tr>
                    <th className="py-2.5 px-4 font-semibold">Size</th>
                    <th className="py-2.5 px-4 font-semibold">Chest Width</th>
                    <th className="py-2.5 px-4 font-semibold">Body Length</th>
                    <th className="py-2.5 px-4 font-semibold">Sleeve Length</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-neutral-100">
                  {chartData.map((row, idx) => (
                    <tr key={idx} className="hover:bg-neutral-50">
                      <td className="py-2.5 px-4 font-bold text-black">{row.size}</td>
                      <td className="py-2.5 px-4 text-neutral-700">{unit === 'IN' ? `${row.chestIN}"` : `${row.chestCM} cm`}</td>
                      <td className="py-2.5 px-4 text-neutral-700">{unit === 'IN' ? `${row.lengthIN}"` : `${row.lengthCM} cm`}</td>
                      <td className="py-2.5 px-4 text-neutral-700">{unit === 'IN' ? `${row.sleeveIN}"` : `${row.sleeveCM} cm`}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- SEARCH OVERLAY ---
    function SearchModal() {
      const { isSearchOpen, setIsSearchOpen, searchQuery, setSearchQuery, setSelectedProduct, formatPrice } = useStore();
      const inputRef = useRef(null);

      useEffect(() => {
        if (isSearchOpen && inputRef.current) inputRef.current.focus();
      }, [isSearchOpen]);

      if (!isSearchOpen) return null;

      const searchResults = PRODUCTS_DATA.filter(p => 
        p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.tagline.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.fit.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="fixed inset-0 z-50 bg-white/95 backdrop-blur-md p-6 sm:p-12 animate-fade-in flex flex-col items-center">
          <div className="w-full max-w-3xl">
            <div className="flex items-center justify-between border-b-2 border-black pb-4 mb-8">
              <div className="flex items-center gap-3 flex-1">
                <Icon name="Search" size={24} className="text-black" />
                <input 
                  ref={inputRef}
                  type="text" 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="SEARCH GARMENTS, GSM WEIGHT, CUT..."
                  className="w-full bg-transparent text-xl sm:text-2xl font-sans font-medium text-black placeholder:text-neutral-400 focus:outline-none uppercase tracking-wider"
                />
              </div>
              <button 
                onClick={() => { setIsSearchOpen(false); setSearchQuery(''); }}
                className="text-neutral-500 hover:text-black p-2 transition-colors"
              >
                <Icon name="X" size={24} />
              </button>
            </div>

            <div className="overflow-y-auto max-h-[70vh] space-y-4">
              {searchQuery.trim() === '' ? (
                <div className="text-xs font-mono text-neutral-500 space-y-2">
                  <span className="uppercase tracking-widest block mb-2 text-[11px] font-semibold text-neutral-700">Popular Searches:</span>
                  <div className="flex flex-wrap gap-2">
                    {['340 GSM Hoodie', '240 GSM Tee', 'Centipede Spine', 'Gothic Graphic', 'Parachute Pants', 'Delhi Drop'].map((tag, i) => (
                      <button 
                        key={i}
                        onClick={() => setSearchQuery(tag)}
                        className="bg-neutral-100 px-3.5 py-2 border border-neutral-200 hover:border-black text-neutral-800 text-xs font-sans tracking-wide uppercase transition-colors"
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>
              ) : searchResults.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {searchResults.map(prod => (
                    <div 
                      key={prod.id}
                      onClick={() => {
                        setSelectedProduct(prod);
                        setIsSearchOpen(false);
                      }}
                      className="flex gap-4 p-3 bg-white border border-neutral-200 hover:border-black cursor-pointer transition-colors"
                    >
                      {prod.images && prod.images.length > 0 ? (
                        <img src={prod.images[0]} alt={prod.name} className="w-16 h-20 object-cover bg-neutral-100 flex-shrink-0" />
                      ) : (
                        <div className="w-16 h-20 bg-[#F5F5F5] border border-neutral-200 flex items-center justify-center flex-shrink-0" />
                      )}
                      <div className="flex flex-col justify-center">
                        <span className="text-[10px] font-mono uppercase tracking-wider text-neutral-500">{prod.category} • {prod.fit}</span>
                        <h4 className="text-xs font-bold text-black uppercase tracking-wide mt-0.5">{prod.name}</h4>
                        <span className="text-xs font-bold text-black mt-1 price-text">{formatPrice(prod.priceINR)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <p className="text-center py-12 font-mono text-xs text-neutral-500">
                  No matching garments located for "{searchQuery}".
                </p>
              )}
            </div>

          </div>
        </div>
      );
    }

    // --- CLEAN CONTEMPORARY LUXURY FOOTER ---
    function Footer() {
      const { setIsAuthOpen, setAuthView } = useStore();
      return (
        <footer className="bg-white border-t border-neutral-200 pt-16 pb-12 text-neutral-600 font-sans text-xs">
          <div className="max-w-7xl mx-auto px-6 sm:px-8">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-12 pb-12">
              
              {/* Col 1: Brand Info */}
              <div className="space-y-4">
                <span className="text-lg font-bold tracking-[0.2em] text-black uppercase block">
                  PUNK THRIFT STUDIO
                </span>
                <p className="text-[12px] leading-relaxed text-neutral-500 max-w-sm">
                  Heavyweight contemporary streetwear and archival thrift curation based in New Delhi, India. Milled with 200–340 GSM Indian combed cotton and custom hardware.
                </p>
                <div className="pt-1 text-[11px] text-neutral-400 font-mono">
                  NEW DELHI, INDIA • EST. 2026
                </div>
              </div>

              {/* Col 2: Directory */}
              <div className="space-y-3 uppercase tracking-wider text-[11px]">
                <span className="text-black font-bold tracking-[0.16em] block mb-4">Catalogue</span>
                <a href="#shop-section" className="block text-neutral-600 hover:text-black transition-colors">Shop Batch 01</a>
                <a href="#lookbook-section" className="block text-neutral-600 hover:text-black transition-colors">Delhi Lookbook</a>
                <a href="#drops-section" className="block text-neutral-600 hover:text-black transition-colors">Drop Countdown</a>
                <a href="#about-section" className="block text-neutral-600 hover:text-black transition-colors">Sourcing Manifesto</a>
                <button onClick={() => { setAuthView('login'); setIsAuthOpen(true); }} className="block text-neutral-600 hover:text-black transition-colors uppercase tracking-wider text-[11px]">Member Sign In</button>
              </div>

              {/* Col 3: Customer Service */}
              <div className="space-y-3 uppercase tracking-wider text-[11px]">
                <span className="text-black font-bold tracking-[0.16em] block mb-4">Customer Care</span>
                <span className="block text-neutral-600">Pan-India Express Delivery (Bluedart/Delhivery)</span>
                <span className="block text-neutral-600">UPI / Cards / NetBanking Accepted</span>
                <span className="block text-neutral-600">7-Day Easy Size Exchanges</span>
                <span className="block text-neutral-600">Delhi Studio Concierge: support@punkstudios.in</span>
              </div>

            </div>

            <div className="border-t border-neutral-100 pt-8 flex flex-col sm:flex-row items-center justify-between text-[11px] text-neutral-400 uppercase tracking-widest gap-4">
              <span>© 2026 PUNK THRIFT STUDIO. ALL RIGHTS RESERVED.</span>
              <div className="flex gap-6">
                <a href="#" className="hover:text-black transition-colors">Privacy</a>
                <a href="#" className="hover:text-black transition-colors">Terms of Service</a>
                <a href="#" className="hover:text-black transition-colors">Shipping Policy</a>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    // --- AUTH MODAL (LOGIN / SIGN UP) ---
    function AuthModal() {
      const { isAuthOpen, setIsAuthOpen, authView, setAuthView, login, signUp } = useStore();
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        if (isAuthOpen) {
          setError('');
          setPassword('');
          setShowPassword(false);
        }
      }, [isAuthOpen, authView]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isAuthOpen) setIsAuthOpen(false);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isAuthOpen]);

      if (!isAuthOpen) return null;

      const isSignup = authView === 'signup';

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        if (!email.trim() || !password) {
          setError('Please enter your email and password.');
          return;
        }
        if (isSignup && !name.trim()) {
          setError('Please enter your full name.');
          return;
        }
        setIsSubmitting(true);
        setTimeout(() => {
          const ok = isSignup ? signUp(name, email, password) : login(email, password);
          setIsSubmitting(false);
          if (!ok) {
            setError(isSignup
              ? 'Could not create account — check the details and try again.'
              : 'Invalid email or password. New here? Create an account below.');
          } else {
            setName(''); setEmail(''); setPassword('');
          }
        }, 600);
      };

      return (
        <div
          className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fade-in overflow-y-auto"
          onClick={() => setIsAuthOpen(false)}
        >
          <div
            className="relative w-full max-w-4xl bg-white border border-neutral-200 shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-2 my-8 text-black animate-fade-in"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Left Brand Panel */}
            <div className="hidden lg:flex flex-col justify-between bg-black text-white p-10">
              <div>
                <span className="text-2xl font-black tracking-[0.22em] uppercase block">PUNK THRIFT</span>
                <span className="text-[10px] tracking-[0.3em] text-neutral-400 uppercase">Studio · Delhi Archive</span>
              </div>
              <div className="space-y-5">
                <h3 className="font-sans text-3xl font-black tracking-[0.14em] uppercase leading-tight">
                  MEMBERS<br />GET FIRST<br />ACCESS.
                </h3>
                <ul className="space-y-3 text-[11px] uppercase tracking-[0.16em] text-neutral-300">
                  {['Early access to every drop', 'Order history & tracking', 'Member-only pricing codes', 'Wishlist saved to your account'].map((perk, i) => (
                    <li key={i} className="flex items-center gap-2.5">
                      <Icon name="Check" size={13} className="text-white" />
                      <span>{perk}</span>
                    </li>
                  ))}
                </ul>
              </div>
              <span className="text-[10px] text-neutral-500 uppercase tracking-[0.2em]">EST. 2026 · NEW DELHI, INDIA</span>
            </div>

            {/* Right Form Panel */}
            <div className="p-6 sm:p-10 flex flex-col justify-center bg-white">
              <button
                onClick={() => setIsAuthOpen(false)}
                className="absolute top-4 right-4 w-8 h-8 rounded-full border border-neutral-300 text-neutral-500 hover:text-black hover:border-black flex items-center justify-center transition-colors"
                title="Close (Esc)"
              >
                <Icon name="X" size={15} />
              </button>

              <span className="text-[10px] font-mono uppercase tracking-[0.24em] text-neutral-500 mb-1.5">
                {isSignup ? 'Join The Archive' : 'Member Access'}
              </span>
              <h3 className="font-sans text-2xl font-black tracking-[0.14em] uppercase mb-1">
                {isSignup ? 'CREATE ACCOUNT' : 'SIGN IN'}
              </h3>
              <p className="text-xs text-neutral-500 mb-7">
                {isSignup
                  ? 'One-of-one drops sell out fast. Members shop 24 hours early.'
                  : 'Welcome back to the archive. Sign in to continue.'}
              </p>

              <form onSubmit={handleSubmit} className="space-y-4">
                {isSignup && (
                  <div>
                    <label className="block text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-semibold mb-1.5">Full Name</label>
                    <input
                      type="text"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Your name"
                      className="w-full border border-neutral-300 rounded-none px-3.5 py-3 text-sm text-black placeholder:text-neutral-400 focus:outline-none focus:border-black transition-colors bg-white"
                      autoComplete="name"
                    />
                  </div>
                )}

                <div>
                  <label className="block text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-semibold mb-1.5">Email</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="you@example.com"
                    className="w-full border border-neutral-300 rounded-none px-3.5 py-3 text-sm text-black placeholder:text-neutral-400 focus:outline-none focus:border-black transition-colors bg-white"
                    autoComplete="email"
                  />
                </div>

                <div>
                  <label className="block text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-semibold mb-1.5">Password</label>
                  <div className="relative">
                    <input
                      type={showPassword ? 'text' : 'password'}
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder={isSignup ? 'Minimum 6 characters' : 'Your password'}
                      className="w-full border border-neutral-300 rounded-none px-3.5 py-3 pr-11 text-sm text-black placeholder:text-neutral-400 focus:outline-none focus:border-black transition-colors bg-white"
                      autoComplete={isSignup ? 'new-password' : 'current-password'}
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-black transition-colors"
                      title={showPassword ? 'Hide password' : 'Show password'}
                    >
                      <Icon name={showPassword ? 'EyeOff' : 'Eye'} size={16} />
                    </button>
                  </div>
                </div>

                {error && (
                  <div className="flex items-center gap-2 text-[11px] text-red-600 font-semibold uppercase tracking-wider bg-red-50 border border-red-200 px-3 py-2.5">
                    <Icon name="AlertCircle" size={13} />
                    <span>{error}</span>
                  </div>
                )}

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className={`w-full py-3.5 rounded-none font-sans text-xs font-bold tracking-[0.22em] uppercase transition-all flex items-center justify-center gap-2 shadow-sm ${
                    isSubmitting ? 'bg-neutral-300 text-neutral-500 cursor-wait' : 'bg-black hover:bg-neutral-800 text-white active:scale-98'
                  }`}
                >
                  {isSubmitting ? (
                    <>
                      <Icon name="Loader2" size={15} className="animate-spin" />
                      <span>{isSignup ? 'Creating Account...' : 'Signing In...'}</span>
                    </>
                  ) : (
                    <>
                      <Icon name={isSignup ? 'UserPlus' : 'LogIn'} size={14} />
                      <span>{isSignup ? 'Create Account' : 'Sign In'}</span>
                    </>
                  )}
                </button>
              </form>

              <div className="mt-6 pt-5 border-t border-neutral-200 text-center text-xs">
                {isSignup ? (
                  <span className="text-neutral-500">
                    Already a member?{' '}
                    <button onClick={() => setAuthView('login')} className="text-black font-bold uppercase tracking-wider hover:underline">Sign In</button>
                  </span>
                ) : (
                  <span className="text-neutral-500">
                    New to PUNK THRIFT STUDIO?{' '}
                    <button onClick={() => setAuthView('signup')} className="text-black font-bold uppercase tracking-wider hover:underline">Create an account</button>
                  </span>
                )}
              </div>

              <p className="mt-4 text-[10px] text-neutral-400 text-center leading-relaxed">
                Demo storefront — accounts are stored only on this device.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const { toastMessage } = useStore();

      return (
        <div className="min-h-screen flex flex-col bg-white text-[#0A0A0A] font-sans antialiased selection:bg-black selection:text-white">
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-black text-white px-5 py-3 shadow-2xl font-sans text-xs uppercase tracking-wider flex items-center gap-3 animate-fade-in border border-neutral-800">
              <span className="w-1.5 h-1.5 rounded-full bg-white"></span>
              <span>{toastMessage}</span>
            </div>
          )}

          <AnnouncementBar />
          <Header />
          
          <main className="flex-1">
            <Hero />
            <HorizontalLookbook />
            <ProductGrid />
            <DropCountdown />
            <BrandStory />
          </main>

          <Footer />

          <ProductDetailModal />
          <CartDrawer />
          <SizeGuideModal />
          <SearchModal />
          <AuthModal />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <StoreProvider>
        <App />
      </StoreProvider>
    );
  </script>
</body>
</html>
